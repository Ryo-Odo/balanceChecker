services:
  - type: web
    name: balance-checker
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /balanceChecker/login
    envVars:
      - key: BALANCECHECKER_DB_URL
        sync: false
      - key: BALANCECHECKER_DB_USER
        sync: false
      - key: BALANCECHECKER_DB_PASSWORD
        sync: false
